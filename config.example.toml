# Papaya CMS Configuration
# Copy this file to config.toml and fill in your values
# Environment variables can override using double underscore separator
# e.g., S3__ENDPOINT=https://s3.example.com

[server]
host = "0.0.0.0"
port = 8080

[s3]
endpoint = "https://s3.amazonaws.com"
region = "us-east-1"
bucket = "your-bucket-name"
access_key = "your-access-key"
secret_key = "your-secret-key"
force_path_style = false

[site]
name = "Papaya Blog"
description = "A lightweight, fast blog platform"
base_url = "https://your-domain.com"

[api]
refresh_token = "your-secure-random-token-here"