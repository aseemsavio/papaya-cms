[workspace]
members = [
    "backend"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/aseemsavio/papaya-cms"

[workspace.dependencies]
axum = { version = "0.8", features = ["macros", "json", "multipart"] }
tokio = { version = "1.42", features = ["full", "macros"] }
tracing = { version = "0.1.41", features = ["attributes"] }
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json", "local-time"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_yaml = "0.9.34"
config = "0.15"
once_cell = "1.19"
thiserror = "2.0"
pulldown-cmark = { version = "0.12", features = ["simd"] }
tera = "2.4"
aws-config = { version = "1.8.6", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-s3 = { version = "1.122.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "http-1x", "sigv4a"] }
aws-credential-types = "1.2"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tower = "0.5"
uuid = { version = "1.11", features = ["v4", "serde", "fast-rng"] }
chrono = { version = "0.4.42", features = ["serde"] }
regex = "1.11"
anyhow = "1.0"
indicatif = "0.17"
clap = { version = "4.5", features = ["derive", "env"] }
tempfile = "3.10"
git2 = "0.19"
glob = "0.3"
mime_guess = "2.0"

# Pin Smithy crates for Rust <1.91 and to unify the dependency graph
aws-smithy-runtime-api = "=1.11.3"
aws-smithy-async = "=1.2.11"
aws-smithy-eventstream = "=0.60.18"
aws-smithy-http = "=0.63.3"
aws-smithy-observability = "=0.2.4"
aws-smithy-types = "=1.4.3"
aws-smithy-xml = "=0.60.13"