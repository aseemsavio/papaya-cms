<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Orbit — a single ring of light">
  <defs>
    <radialGradient id="o1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1112"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="o2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0"/>
      <stop offset="45%" stop-color="#a7f3d0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8cb4aa" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#o1)"/>
  <g transform="translate(800 450)" fill="none" filter="url(#glow)">
    <ellipse rx="330" ry="330" stroke="url(#o2)" stroke-width="1.6" transform="rotate(-24)"/>
    <ellipse rx="330" ry="118" stroke="url(#o2)" stroke-width="1.4" transform="rotate(-24)" stroke-opacity="0.6"/>
    <ellipse rx="118" ry="330" stroke="url(#o2)" stroke-width="1.4" transform="rotate(-24)" stroke-opacity="0.6"/>
  </g>
  <circle cx="800" cy="450" r="58" fill="#0a0c0e" stroke="#8cb4aa" stroke-opacity="0.5"/>
  <circle cx="1074" cy="318" r="7" fill="#b4e650" filter="url(#glow)"/>
</svg>
