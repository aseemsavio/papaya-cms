{#- Shared site footer. -#}
<footer class="site-footer">
    <div class="footer-inner">
        <div class="footer-brand-block">
            <a class="footer-brand" href="/">{{ site_name }}</a>
            <span class="footer-tag">{{ site_description }}</span>
        </div>
        <div class="footer-meta">
            <a href="https://getotia.com" target="_blank" rel="noopener noreferrer">getotia.com</a>
            <span class="dot">·</span>
            <a href="mailto:support@getotia.com">support@getotia.com</a>
            <span class="dot">·</span>
            <span class="footer-copy">© <span id="footer-year">&nbsp;</span> {{ site_name }}</span>
            <span class="dot">·</span>
            <span>Built with <a href="https://github.com/aseemsavio/papaya-cms" target="_blank" rel="noopener noreferrer">Papaya CMS</a></span>
        </div>
    </div>
</footer>
