{#- Shared runtime: header state, reading progress, reveal, and the markdown → rich HTML enhancers. -#}
{% raw %}
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-rust.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-toml.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-go.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markdown.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-docker.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-ini.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-diff.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-graphql.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
(function () {
    'use strict';

    var doc = document;
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ---------- chrome ---------- */

    var header = doc.getElementById('site-header');
    var bar = doc.querySelector('#reading-progress span');
    var year = doc.getElementById('footer-year');

    if (year) {
        year.textContent = String(new Date().getFullYear());
    }

    function onScroll() {
        if (header) {
            header.classList.toggle('is-scrolled', window.scrollY > 12);
        }
        if (bar) {
            var max = doc.documentElement.scrollHeight - window.innerHeight;
            var ratio = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
            bar.style.transform = 'scaleX(' + ratio + ')';
        }
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
    onScroll();

    /* ---------- helpers ---------- */

    function el(tag, className, text) {
        var node = doc.createElement(tag);
        if (className) { node.className = className; }
        if (text != null) { node.textContent = text; }
        return node;
    }

    function pad(n) {
        return (n < 10 ? '0' : '') + n;
    }

    /* ---------- reveal on scroll ---------- */

    function setupReveal(root) {
        var nodes = root.querySelectorAll('[data-reveal]');
        if (!nodes.length) { return; }

        if (reduceMotion || !('IntersectionObserver' in window)) {
            Array.prototype.forEach.call(nodes, function (n) { n.classList.add('is-visible'); });
            return;
        }

        var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { rootMargin: '-6% 0px -8% 0px', threshold: 0.03 });

        Array.prototype.forEach.call(nodes, function (n) { observer.observe(n); });
    }

    /* ---------- prism ---------- */

    function highlight(root) {
        if (!window.Prism) { return; }
        var blocks = root.querySelectorAll('pre code[class*="language-"]');
        Array.prototype.forEach.call(blocks, function (block) {
            var match = /language-([\w-]+)/.exec(block.className);
            var lang = match ? match[1].toLowerCase() : '';
            if (lang === 'mermaid' || lang === 'carousel' || lang === 'gallery') { return; }
            if (lang && window.Prism.languages && !window.Prism.languages[lang]) { return; }
            try {
                window.Prism.highlightElement(block);
            } catch (err) {
                /* leave unhighlighted */
            }
        });
    }

    /* ---------- code blocks (frame + copy) ---------- */

    function frameCodeBlocks(root) {
        var pres = Array.prototype.slice.call(root.querySelectorAll('pre'));
        pres.forEach(function (pre) {
            var code = pre.querySelector('code');
            if (!code) { return; }
            var match = /language-([\w-]+)/.exec(code.className || '');
            var lang = match ? match[1].toLowerCase() : '';
            if (lang === 'mermaid' || lang === 'carousel' || lang === 'gallery') { return; }
            if (pre.parentElement && pre.parentElement.classList.contains('code-block')) { return; }

            var shell = el('div', 'code-block');
            var head = el('div', 'code-head');
            head.appendChild(el('span', 'code-lang', lang || 'text'));

            var copy = el('button', 'code-copy', 'Copy');
            copy.type = 'button';
            copy.setAttribute('aria-label', 'Copy code to clipboard');
            copy.addEventListener('click', function () {
                var text = code.textContent;
                var done = function () {
                    copy.classList.add('is-copied');
                    copy.textContent = 'Copied';
                    window.setTimeout(function () {
                        copy.classList.remove('is-copied');
                        copy.textContent = 'Copy';
                    }, 1600);
                };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
                } else {
                    fallbackCopy(text, done);
                }
            });

            head.appendChild(copy);
            shell.appendChild(head);
            pre.parentNode.insertBefore(shell, pre);
            shell.appendChild(pre);
        });
    }

    function fallbackCopy(text, done) {
        try {
            var area = el('textarea');
            area.value = text;
            area.setAttribute('readonly', 'readonly');
            area.style.position = 'fixed';
            area.style.opacity = '0';
            doc.body.appendChild(area);
            area.select();
            doc.execCommand('copy');
            doc.body.removeChild(area);
            done();
        } catch (err) {
            /* ignore */
        }
    }

    /* ---------- tables ---------- */

    function wrapTables(root) {
        var tables = Array.prototype.slice.call(root.querySelectorAll('table'));
        tables.forEach(function (table) {
            var parent = table.parentElement;
            if (parent && parent.classList.contains('table-wrap')) { return; }
            var wrap = el('div', 'table-wrap');
            wrap.setAttribute('data-reveal', '');
            table.parentNode.insertBefore(wrap, table);
            wrap.appendChild(table);
        });
    }

    /* ---------- task lists ---------- */

    function markTaskLists(root) {
        var lists = Array.prototype.slice.call(root.querySelectorAll('ul'));
        lists.forEach(function (list) {
            if (!list.querySelector('input[type="checkbox"]')) { return; }
            list.classList.add('contains-task-list');
            Array.prototype.forEach.call(list.children, function (item) {
                if (item.tagName === 'LI' && item.querySelector('input[type="checkbox"]')) {
                    item.classList.add('task-list-item');
                }
            });
        });
    }

    /* ---------- headings: ids + anchors ---------- */

    function slugify(text) {
        return String(text)
            .toLowerCase()
            .replace(/[^\w\s-]/g, '')
            .trim()
            .replace(/\s+/g, '-')
            .slice(0, 64) || 'section';
    }

    function addHeadingAnchors(root) {
        var headings = Array.prototype.slice.call(root.querySelectorAll('h1, h2, h3, h4'));
        var seen = {};
        headings.forEach(function (heading) {
            var id = heading.id || slugify(heading.textContent);
            if (seen[id]) {
                seen[id] += 1;
                id = id + '-' + seen[id];
            } else {
                seen[id] = 1;
            }
            heading.id = id;

            var anchor = el('a', 'heading-anchor', '#');
            anchor.href = '#' + id;
            anchor.setAttribute('aria-label', 'Link to this section');
            anchor.setAttribute('title', 'Link to this section');
            heading.appendChild(anchor);
        });
    }

    /* ---------- callouts: > [!NOTE] ---------- */

    var CALLOUT_TYPES = ['NOTE', 'TIP', 'IMPORTANT', 'WARNING', 'CAUTION'];

    function setupCallouts(root) {
        var quotes = Array.prototype.slice.call(root.querySelectorAll('blockquote'));
        quotes.forEach(function (quote) {
            var first = quote.querySelector('p');
            if (!first) { return; }
            var match = /^\s*\[!(\w+)\]\s*/.exec(first.textContent || '');
            if (!match) { return; }
            var type = match[1].toUpperCase();
            if (CALLOUT_TYPES.indexOf(type) === -1) { return; }

            var remaining = match[0];
            while (remaining && first.firstChild) {
                var node = first.firstChild;
                if (node.nodeType === 3) {
                    if (node.data.length <= remaining.length) {
                        remaining = remaining.slice(node.data.length);
                        first.removeChild(node);
                    } else {
                        node.data = node.data.slice(remaining.length);
                        remaining = '';
                    }
                } else if (node.nodeType === 1) {
                    first.removeChild(node);
                } else {
                    first.removeChild(node);
                }
            }
            if (first.children.length === 0 && !(first.textContent || '').trim()) {
                first.parentNode.removeChild(first);
            }

            quote.classList.add('callout', 'callout-' + type.toLowerCase());
            var title = el('p', 'callout-title', type.charAt(0) + type.slice(1).toLowerCase());
            quote.insertBefore(title, quote.firstChild);
            quote.setAttribute('data-reveal', '');
        });
    }

    /* ---------- footnotes ---------- */

    function groupFootnotes(root) {
        var defs = Array.prototype.slice.call(root.querySelectorAll(':scope > .footnote-definition'));
        if (!defs.length) { return; }
        var section = el('section', 'footnotes');
        section.setAttribute('data-reveal', '');
        section.appendChild(el('p', 'footnotes-title', 'Notes'));
        defs.forEach(function (def) { section.appendChild(def); });
        root.appendChild(section);
    }

    /* ---------- reading time ---------- */

    function setReadingTime(root) {
        var target = doc.getElementById('reading-time');
        if (!target) { return; }
        var words = (root.textContent || '').trim().split(/\s+/).filter(Boolean).length;
        var minutes = Math.max(1, Math.round(words / 215));
        target.textContent = minutes + ' min read';
    }

    /* ---------- mermaid ---------- */

    var mermaidQueue = [];

    function renderMermaid(item) {
        if (!window.mermaid) { return; }
        initMermaid();
        Promise.resolve()
            .then(function () {
                return window.mermaid.render('otia-mermaid-' + Math.random().toString(36).slice(2), item.source);
            })
            .then(function (result) {
                item.wrap.removeAttribute('data-processing');
                item.host.innerHTML = result.svg;
                var svg = item.host.querySelector('svg');
                if (svg) {
                    svg.removeAttribute('height');
                    svg.style.maxWidth = '100%';
                }
            })
            .catch(function () {
                showMermaidSource(item);
            });
    }

    function showMermaidSource(item) {
        item.wrap.removeAttribute('data-processing');
        item.host.textContent = '';
        item.host.appendChild(el('pre', 'mermaid-error', item.source));
    }

    function setupMermaid(root) {
        var nodes = Array.prototype.slice.call(root.querySelectorAll('pre > code.language-mermaid'));
        if (!nodes.length) { return; }

        nodes.forEach(function (code) {
            var source = code.textContent || '';
            var wrap = el('div', 'mermaid-wrap');
            wrap.setAttribute('data-reveal', '');
            code.parentNode.parentNode.insertBefore(wrap, code.parentNode);
            var host = el('div', 'mermaid');
            wrap.appendChild(host);
            if (code.parentNode && code.parentNode.parentNode) {
                code.parentNode.parentNode.removeChild(code.parentNode);
            }

            var item = { source: source, wrap: wrap, host: host };
            mermaidQueue.push(item);
            if (window.mermaid) {
                renderMermaid(item);
            } else {
                wrap.setAttribute('data-processing', '');
            }
        });
    }

    function flushMermaid() {
        if (!mermaidQueue.length) { return; }
        if (!window.mermaid) {
            mermaidQueue.forEach(showMermaidSource);
            mermaidQueue = [];
            return;
        }
        initMermaid();
        mermaidQueue.forEach(renderMermaid);
        mermaidQueue = [];
    }

    function initMermaid() {
        if (!window.mermaid || window.mermaid.__otiaReady) { return; }
        window.mermaid.__otiaReady = true;
        window.mermaid.initialize({
            startOnLoad: false,
            securityLevel: 'loose',
            theme: 'base',
            fontFamily: '"Source Serif 4", Georgia, "Times New Roman", serif',
            themeVariables: {
                darkMode: true,
                background: 'transparent',
                fontFamily: '"Source Serif 4", Georgia, serif',
                fontSize: '15px',
                primaryColor: '#0e1512',
                primaryTextColor: '#f5f5f4',
                primaryBorderColor: '#8cb4aa',
                secondaryColor: '#101816',
                secondaryTextColor: '#e7e5e4',
                secondaryBorderColor: '#49605a',
                tertiaryColor: '#0b100e',
                tertiaryTextColor: '#e7e5e4',
                tertiaryBorderColor: '#3d4f4a',
                lineColor: '#7f9c95',
                textColor: '#e7e5e4',
                mainBkg: '#0e1413',
                nodeBorder: '#8cb4aa',
                nodeTextColor: '#f5f5f4',
                clusterBkg: 'rgba(140, 180, 170, 0.07)',
                clusterBorder: 'rgba(140, 180, 170, 0.3)',
                edgeLabelBackground: '#0a0c0e',
                titleColor: '#f5f5f4',
                actorBkg: '#0e1413',
                actorBorder: '#8cb4aa',
                actorTextColor: '#f5f5f4',
                signalColor: '#a8a29e',
                signalTextColor: '#e7e5e4',
                labelBoxBkgColor: '#0e1413',
                labelBoxBorderColor: '#8cb4aa',
                noteBkgColor: '#131a12',
                noteBorderColor: '#b4e650',
                noteTextColor: '#e7f5c9',
                pie1: '#8cb4aa',
                pie2: '#b4e650',
                pie3: '#a7f3d0',
                pie4: '#5f7d76',
                pie5: '#d7e9a8',
                pie6: '#3d4f4a',
                pieTitleTextSize: '16px',
                pieSectionTextColor: '#050505',
                git0: '#8cb4aa',
                git1: '#b4e650',
                git2: '#a7f3d0',
                git3: '#5f7d76'
            },
            flowchart: { curve: 'basis', htmlLabels: true, padding: 16, useMaxWidth: true },
            sequence: { useMaxWidth: true, actorMargin: 60 },
            gantt: { useMaxWidth: true },
            pie: { useMaxWidth: true }
        });
    }

    /* ---------- carousel ---------- */

    function buildCarousel(slides) {
        if (!slides.length) { return null; }

        var root = el('div', 'carousel');
        var stage = el('div', 'carousel-stage');
        var track = el('div', 'carousel-track');

        var multi = slides.length > 1;
        var prev = null;
        var next = null;
        if (multi) {
            prev = el('button', 'carousel-btn carousel-prev', '\u2039');
            prev.type = 'button';
            prev.setAttribute('aria-label', 'Previous slide');
            next = el('button', 'carousel-btn carousel-next', '\u203A');
            next.type = 'button';
            next.setAttribute('aria-label', 'Next slide');
        }

        slides.forEach(function (slide) {
            var wrapper = el('div', 'carousel-slide');
            var img = doc.createElement('img');
            img.src = slide.src;
            img.alt = slide.caption || '';
            img.loading = 'lazy';
            img.draggable = false;
            wrapper.appendChild(img);
            track.appendChild(wrapper);
        });

        stage.appendChild(track);
        if (prev) { stage.appendChild(prev); }
        if (next) { stage.appendChild(next); }
        root.appendChild(stage);

        var foot = el('div', 'carousel-foot');
        var caption = el('p', 'carousel-caption', slides[0].caption || '');
        var dots = el('div', 'carousel-dots');
        var count = el('span', 'carousel-count', '01 / ' + pad(slides.length));
        foot.appendChild(caption);
        foot.appendChild(dots);
        foot.appendChild(count);
        root.appendChild(foot);

        var dotNodes = slides.map(function (slide, i) {
            var dot = el('button', 'carousel-dot');
            dot.type = 'button';
            dot.setAttribute('aria-label', 'Go to slide ' + (i + 1));
            dot.addEventListener('click', function () { go(i); });
            dots.appendChild(dot);
            return dot;
        });

        var index = 0;

        function go(nextIndex, instant) {
            index = (nextIndex + slides.length) % slides.length;
            track.style.transition = instant || reduceMotion ? 'none' : '';
            track.style.transform = 'translateX(' + (-100 * index) + '%)';
            dotNodes.forEach(function (dot, i) {
                dot.setAttribute('aria-current', i === index ? 'true' : 'false');
            });
            caption.textContent = slides[index].caption || '';
            count.textContent = pad(index + 1) + ' / ' + pad(slides.length);
        }

        go(0, true);

        if (prev) { prev.addEventListener('click', function () { go(index - 1); }); }
        if (next) { next.addEventListener('click', function () { go(index + 1); }); }

        if (multi) {
            root.setAttribute('tabindex', '0');
            root.setAttribute('role', 'group');
            root.setAttribute('aria-roledescription', 'carousel');
            root.addEventListener('keydown', function (event) {
                if (event.key === 'ArrowLeft') { event.preventDefault(); go(index - 1); }
                if (event.key === 'ArrowRight') { event.preventDefault(); go(index + 1); }
            });

            var startX = null;
            var dragging = false;
            track.addEventListener('pointerdown', function (event) {
                startX = event.clientX;
                dragging = true;
                track.style.transition = 'none';
            });
            track.addEventListener('pointermove', function (event) {
                if (!dragging || startX === null) { return; }
                var dx = event.clientX - startX;
                track.style.transform = 'translateX(calc(' + (-100 * index) + '% + ' + dx + 'px))';
            });
            var endDrag = function (event) {
                if (!dragging) { return; }
                dragging = false;
                var dx = startX === null ? 0 : event.clientX - startX;
                startX = null;
                track.style.transition = '';
                if (Math.abs(dx) > 45) {
                    go(index + (dx < 0 ? 1 : -1));
                } else {
                    go(index);
                }
            };
            track.addEventListener('pointerup', endDrag);
            track.addEventListener('pointercancel', endDrag);
            track.addEventListener('pointerleave', endDrag);

            if (!reduceMotion) {
                var timer = null;
                var schedule = function () {
                    timer = window.setInterval(function () { go(index + 1); }, 7000);
                };
                var stop = function () {
                    if (timer) { window.clearInterval(timer); timer = null; }
                };
                root.addEventListener('mouseenter', stop);
                root.addEventListener('mouseleave', schedule);
                root.addEventListener('focusin', stop);
                root.addEventListener('focusout', schedule);
                doc.addEventListener('visibilitychange', function () {
                    if (doc.hidden) { stop(); } else if (!timer) { schedule(); }
                });
                schedule();
            }
        }

        return root;
    }

    function setupCarousels(root) {
        var results = [];

        var fences = Array.prototype.slice.call(root.querySelectorAll('pre > code.language-carousel, pre > code.language-gallery'));
        fences.forEach(function (code) {
            var slides = (code.textContent || '')
                .split('\n')
                .map(function (line) { return line.trim(); })
                .filter(function (line) { return line && line.indexOf('#') !== 0; })
                .map(function (line) {
                    var parts = line.split('|');
                    return { src: parts[0].trim(), caption: (parts[1] || '').trim() };
                })
                .filter(function (slide) { return slide.src; });

            var carousel = buildCarousel(slides);
            if (carousel) {
                code.parentNode.parentNode.replaceChild(carousel, code.parentNode);
                results.push(carousel);
            }
        });

        var galleries = Array.prototype.slice.call(root.querySelectorAll('.gallery'));
        galleries.forEach(function (gallery) {
            var imgs = Array.prototype.slice.call(gallery.querySelectorAll('img'));
            var slides = imgs.map(function (img) {
                return { src: img.getAttribute('src'), caption: img.getAttribute('data-caption') || img.getAttribute('alt') || '' };
            }).filter(function (slide) { return slide.src; });
            var carousel = buildCarousel(slides);
            if (carousel) {
                gallery.parentNode.replaceChild(carousel, gallery);
                results.push(carousel);
            }
        });

        results.forEach(function (carousel) {
            carousel.setAttribute('data-reveal', '');
        });
    }

    /* ---------- lightbox ---------- */

    function setupLightbox(root) {
        var images = Array.prototype.filter.call(root.querySelectorAll('img'), function (img) {
            return !img.closest('.carousel');
        });
        if (!images.length) { return; }

        var box = el('div', 'lightbox');
        box.setAttribute('role', 'dialog');
        box.setAttribute('aria-modal', 'true');
        box.setAttribute('aria-label', 'Image preview');
        var img = doc.createElement('img');
        img.alt = '';
        var caption = el('p', 'lightbox-caption', '');
        var close = el('button', 'lightbox-close', '\u00D7');
        close.type = 'button';
        close.setAttribute('aria-label', 'Close image preview');
        box.appendChild(img);
        box.appendChild(caption);
        box.appendChild(close);
        doc.body.appendChild(box);

        function open(src, alt) {
            img.src = src;
            img.alt = alt || '';
            caption.textContent = alt || '';
            caption.style.display = alt ? '' : 'none';
            box.classList.add('is-open');
            doc.body.style.overflow = 'hidden';
            close.focus();
        }

        function dismiss() {
            box.classList.remove('is-open');
            doc.body.style.overflow = '';
        }

        box.addEventListener('click', function (event) {
            if (event.target === box || event.target === close || event.target === img) { dismiss(); }
        });
        doc.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' && box.classList.contains('is-open')) { dismiss(); }
        });

        images.forEach(function (image) {
            image.setAttribute('tabindex', '0');
            image.setAttribute('role', 'button');
            image.addEventListener('click', function () {
                open(image.currentSrc || image.src, image.getAttribute('alt'));
            });
            image.addEventListener('keydown', function (event) {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    open(image.currentSrc || image.src, image.getAttribute('alt'));
                }
            });
        });
    }

    /* ---------- boot ---------- */

    var root = doc.getElementById('post-content');

    function boot() {
        if (!root) { return; }

        markTaskLists(root);
        setupCallouts(root);
        setupCarousels(root);
        setupMermaid(root);
        wrapTables(root);
        frameCodeBlocks(root);
        groupFootnotes(root);
        highlight(root);
        addHeadingAnchors(root);
        setReadingTime(root);
        setupLightbox(root);

        Array.prototype.forEach.call(
            root.querySelectorAll('h2, h3, figure, .table-wrap, .callout, .mermaid-wrap, .carousel, .code-block, .footnotes'),
            function (node) { node.setAttribute('data-reveal', ''); }
        );

        setupReveal(root);
    }

    // Run immediately: the markup above this script is already parsed, so the
    // enhancers land before first paint (no flash of unstyled content).
    boot();

    // Prism and Mermaid are deferred, so they arrive just before `load`.
    window.addEventListener('load', function () {
        if (!root) { return; }
        highlight(root);
        flushMermaid();
    });
})();
</script>
