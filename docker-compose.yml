version: '3.8'

services:
  papaya:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: papaya-cms
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - PAPAYA_TEMPLATE_REPO=https://github.com/aseemsavio/papaya-cms
      - PAPAYA_TEMPLATE_NAME=default
      - PAPAYA_TEMPLATE_DIR=/templates
      # S3 Configuration (required)
      - S3__ENDPOINT=https://s3.amazonaws.com
      - S3__REGION=us-east-1
      - S3__BUCKET=your-bucket-name
      - S3__ACCESS_KEY=your-access-key
      - S3__SECRET_KEY=your-secret-key
      - S3__FORCE_PATH_STYLE=false
      # Site Configuration
      - SITE__NAME=Papaya Blog
      - SITE__DESCRIPTION=A lightweight, fast blog platform
      - SITE__BASE_URL=http://localhost:8080
      # API Configuration
      - API__REFRESH_TOKEN=your-secure-random-token-here
    volumes:
      - papaya-templates:/templates
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  papaya-templates: